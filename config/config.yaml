system:
  frame_width: 640
  cooldown_seconds: 3.0

detection:
  confidence_threshold: 0.5

thresholds:
  center_distance: 1.5
  side_distance: 2.0
  min_distance: 1.0
  max_distance: 3.0

modes:
  mode: voice   # voice | silent | debug

scene_description:
  cooldown_seconds: 10.0
  cache_dir: cache
  provider: gemini  # gemini | openai | stub
  model: gemini-2.0-flash
  temperature: 0.3
  max_tokens: 160
  debug: true
  rate_limit:
    min_interval_seconds: 5.0
    max_per_minute: 6
